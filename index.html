<title>Accès protégé</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --text:#1f1d1a; --muted:#6b665d; --border:#e2dfd8; --accent:#2f6f5e; --danger:#b4382f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161513; --card:#1f1e1b; --text:#ece9e3; --muted:#a39d92; --border:#36332e; --accent:#6cc0a5; --danger:#ef8579; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
    font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:16px; }
  form { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:24px; width:100%; max-width:340px; display:grid; gap:12px; }
  h1 { font-size:1.1rem; margin:0; }
  input[type=password] { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
  button { font:inherit; padding:10px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  label { font-size:.85rem; color:var(--muted); display:flex; gap:8px; align-items:center; }
  .err { color:var(--danger); font-size:.85rem; min-height:1.2em; margin:0; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Accès protégé</h1>
  <input type="password" id="p" autocomplete="current-password" placeholder="Mot de passe" required autofocus />
  <label><input type="checkbox" id="r" /> Rester connecté sur cet appareil</label>
  <button id="b">Ouvrir</button>
  <p class="err" id="e" role="alert"></p>
</form>

const KEY_STORE = "locked-page-key:" + location.pathname;
const u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function deriveRaw(pwd) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pwd), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({ name: "PBKDF2", salt: u8(P.salt), iterations: P.iterations, hash: "SHA-256" }, base, 256);
}
async function open(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(P.iv) }, key, u8(P.data));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
  const t = html.match(/<title>([^<]*)<\/title>/);
  if (t) document.title = t[1];
}
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY_STORE); } catch (e) {}
  if (saved) { try { await open(u8(saved)); return; } catch (e) { try { localStorage.removeItem(KEY_STORE); } catch (e2) {} } }
})();
document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const b = document.getElementById("b"), e = document.getElementById("e");
  b.disabled = true; e.textContent = "";
  try {
    const raw = await deriveRaw(document.getElementById("p").value);
    const rester = document.getElementById("r").checked;
    const rawB64 = btoa(String.fromCharCode(...new Uint8Array(raw)));
    await open(raw); // remplace la page : on a lu la case avant
    if (rester) {
      try { localStorage.setItem(KEY_STORE, rawB64); } catch (err) {}

    e.textContent = "Mot de passe incorrect.";
    b.disabled = false;
  }
});
